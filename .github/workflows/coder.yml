name: Implement changes

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
        default: "1"

  issues:
    types:
      - labeled

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  code:
    if: >
      github.event.issue.state == 'open' &&
      github.event.label.name == 'ready_to_code'

    runs-on: ubuntu-latest
    environment: default

    env:
      ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}

    steps:
      - name: Show issue info
        run: |
          echo "Issue #${{ github.event.issue.number }}"
          echo "Title: ${{ github.event.issue.title }}"
          echo "Label: ${{ github.event.label.name }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install openai-agents npcpy

      - name: Prepare workspace
        run: |
          mkdir -p .work/${ISSUE_NUMBER}

      - name: Save last comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "${ISSUE_NUMBER}" \
            --comments \
            --json comments \
            --jq '.comments[-1].body' \
            > .work/${ISSUE_NUMBER}/planner-output.txt

      - name: Run coder
        id: agent_coder
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python .github/scripts/coder.py \
            --model "${{ env.OPENROUTER_MODEL }}" \
            --issue-number "${{ github.event.issue.number }}" \
            --issue-title "${{ github.event.issue.title }}" \
            --issue-body "${{ github.event.issue.body }}" \
            --planner-output ".work/${ISSUE_NUMBER}/planner-output.txt"

      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "coder-bot"
          git config user.email "coder-bot-email"

          gh issue develop "${ISSUE_NUMBER}" --checkout
          BRANCH=$(git branch --show-current)

          git add .
          git restore --staged .work

          COMMIT_MESSAGE=$(cat .work/${ISSUE_NUMBER}/commit_message.txt)
          git commit -m "${COMMIT_MESSAGE}"
          git push --set-upstream origin "$BRANCH"
      - name: Add comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_BODY_FILE=".work/${ISSUE_NUMBER}/pr_body.txt"
          gh issue comment "${ISSUE_NUMBER}" \
            --body-file "${PR_BODY_FILE}"
      - name: Remove ready_to_code label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --remove-label "ready_to_code" \
            --add-label "ready_to_review"
