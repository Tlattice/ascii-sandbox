name: Review changes

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
        default: "1"
  issues:
    types:
      - labeled

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  review:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' &&
       contains(github.event.issue.labels.*.name, 'ready_to_review'))

    runs-on: ubuntu-latest
    environment: default

    env:
      ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      MAX_ATTEMPTS: "3"

    steps:
      - name: Checkout coder branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Load loop state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=$(gh variable get "BRANCH_${ISSUE_NUMBER}")
          ATTEMPT=$(gh variable get "ATTEMPT_${ISSUE_NUMBER}" 2>/dev/null || echo 0)
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "ATTEMPT=$ATTEMPT" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai-agents npcpy

      - name: Prepare workspace
        run: mkdir -p .work/${ISSUE_NUMBER}

      # --- Hard, deterministic gates first. No LLM call if these fail. ---
      - name: Build
        id: build
        continue-on-error: true
        run: go build ./... 2>&1 | tee .work/${ISSUE_NUMBER}/build.log

      - name: Vet
        id: vet
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: go vet ./... 2>&1 | tee .work/${ISSUE_NUMBER}/vet.log

      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: go test -v ./... 2>&1 | tee .work/${ISSUE_NUMBER}/test.log

      # --- LLM code review, only if the code actually builds and passes ---
      - name: Run reviewer
        id: agent_reviewer
        if: steps.build.outcome == 'success' && steps.test.outcome == 'success'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python .github/scripts/reviewer.py \
            --model "${{ env.OPENROUTER_MODEL }}" \
            --issue-number "${{ env.ISSUE_NUMBER }}" \
            --branch "${{ env.BRANCH }}" \
            --output ".work/${ISSUE_NUMBER}/review.json"
          # expects review.json: {"verdict": "approve"|"changes_requested", "feedback": "..."}

      - name: Decide outcome
        id: decide
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            VERDICT="changes_requested"
            FEEDBACK="**Build failed:**
            $(cat .work/${ISSUE_NUMBER}/build.log)"
          elif [ "${{ steps.test.outcome }}" != "success" ]; then
            VERDICT="changes_requested"
            FEEDBACK="**Tests failed:**
            $(cat .work/${ISSUE_NUMBER}/test.log)"
          else
            VERDICT=$(jq -r '.verdict' ".work/${ISSUE_NUMBER}/review.json")
            FEEDBACK=$(jq -r '.feedback' ".work/${ISSUE_NUMBER}/review.json")
          fi

          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          {
            echo "feedback<<EOF"
            echo "$FEEDBACK"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post feedback comment
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --body "${{ steps.decide.outputs.feedback }}"

      - name: Route — approved
        if: steps.decide.outputs.verdict == 'approve'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh issue edit "${ISSUE_NUMBER}" \
            --remove-label "ready_to_review" \
            --add-label "ready_to_merge"

      - name: Route — changes requested, under limit
        if: steps.decide.outputs.verdict != 'approve' && env.ATTEMPT < env.MAX_ATTEMPTS
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh issue edit "${ISSUE_NUMBER}" \
            --remove-label "ready_to_review" \
            --add-label "ready_to_code"

      - name: Route — changes requested, limit exceeded
        if: steps.decide.outputs.verdict != 'approve' && env.ATTEMPT >= env.MAX_ATTEMPTS
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh issue edit "${ISSUE_NUMBER}" \
            --remove-label "ready_to_review" \
            --add-label "needs_human"
          gh issue comment "${ISSUE_NUMBER}" \
            --body "Automated review loop hit its ${MAX_ATTEMPTS}-attempt limit without approval. Flagging for human review."